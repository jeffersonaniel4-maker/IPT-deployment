{% extends "base.html" %}
{% block content %}
<div class="row">
    <!-- Add Product -->
    <div class="col-md-4">
        <div class="card mb-4">
            <div class="card-header">Add New Product</div>
            <div class="card-body">
                <form method="POST">
                    <input type="text" name="barcode" class="form-control mb-2" placeholder="Barcode" required>
                    <input type="text" name="name" class="form-control mb-2" placeholder="Product Name" required>
                    <input type="text" name="category" class="form-control mb-2" placeholder="Category" required>
                    <input type="number" step="0.01" name="price" class="form-control mb-2" placeholder="Price" required>
                    <input type="number" name="stock" class="form-control mb-2" placeholder="Initial Stock" required>
                    <button class="btn btn-primary w-100" type="submit">Save Product</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Product & Inventory List -->
    <div class="col-md-8">
        <form method="GET" class="mb-3">
            <div class="input-group">
                <input type="text" name="search" class="form-control" placeholder="Search by name, barcode, or category" value="{{ search }}">
                <button class="btn btn-outline-secondary" type="submit">Search</button>
            </div>
        </form>
        <table class="table table-bordered bg-white">
            <thead>
                <tr>
                    <th>Barcode</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for product in products %}
                <tr>
                    <td>{{ product.barcode }}</td>
                    <td>{{ product.name }}</td>
                    <td>{{ product.category }}</td>
                    <td>₱{{ "%.2f"|format(product.price) }}</td>
                    <td>
                        <form action="{{ url_for('update_stock', id=product.id) }}" method="POST" class="d-flex">
                            <input type="number" name="stock" value="{{ product.stock }}" class="form-control form-control-sm me-1" style="width: 70px;">
                            <button class="btn btn-sm btn-secondary" type="submit">Update</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
